AutoName: anh-nha
Name: anh-nha
Summary: Custom Android photo sync client for self-hosted Immich server
Description: |-
    anh-nha (ảnh nhà) is a custom Android photo sync client for self-hosted
    Immich servers, accessible via Tailscale VPN.

    Features:
    - Auto-upload photos to Immich server over WiFi when Tailscale is connected
    - Free local storage after verified sync (safe delete of synced photos)
    - Visible offline sync queue with retry
    - Multi-device family dashboard showing per-device sync status
    - Backup integrity verification (checksum comparison)
    - Works without Google Play Services on Android 9+ (API 28)

    Privacy:
    - No telemetry, no analytics
    - No data leaves your Tailscale network
    - No Google Play Services dependency

    This app is designed for personal/family use with a self-hosted Immich
    server. It is not affiliated with the Immich project.

RequiresRoot: false

RepoType: git
Repo: https://github.com/sinh/anh-nha.git

Binaries:
  - https://github.com/sinh/anh-nha/releases/download/v%v/anh-nha-%v.apk

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    subdir: .
    gradle: yes
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons
    ndk: r29

AllowedAPIKeys:
  - 100.100.100.100:41112

MaintainerNotes: |-
    Reproducible build notes:
    - pubspec.lock is committed to ensure deterministic pub dependencies.
    - Flutter stable channel is pinned via srclibs@flutter@stable; for full
      reproducibility pin to a specific Flutter tag (e.g. flutter@3.27.4) and
      update with each release.
    - Build is performed with --no-tree-shake-icons so icon asset handling is
      identical across build environments (tree shaking depends on the exact
      set of referenced icons which can differ between analysis versions).
    - No Google Play Services dependencies are present (no firebase,
      crashlytics, play-services-*). Grep verifies this in CI.
    - APK is signed with the builder's release keystore; F-Droid re-signs
      with its own key during publication, so the unsigned/release build must
      match byte-for-byte after stripping the signature block (F-Droid
      verifies this automatically for Reproducible: true).
    - NDK version r29 is used to match the local build environment
      (android/app/build.gradle.kts pins ndkVersion = 29.0.14206865).

AutoUpdateMode: Version
