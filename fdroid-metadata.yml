AutoName: anh-nha
Summary: Custom Android photo sync client for self-hosted Immich server
Description: |-
    anh-nha (ảnh nhà) is a custom Android photo sync client for self-hosted
    Immich servers, accessible via Tailscale VPN.

    Features:
    - Auto-upload photos to Immich server over WiFi when Tailscale is connected
    - Free local storage after verified sync (safe delete of synced photos)
    - Visible offline sync queue with retry
    - Multi-device family dashboard showing per-device sync status
    - Backup integrity verification (checksum comparison)
    - Works without Google Play Services on Android 9+ (API 28)

    Privacy:
    - No telemetry, no analytics
    - No data leaves your Tailscale network
    - No Google Play Services dependency

RequiresRoot: false

